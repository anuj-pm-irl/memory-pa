<svg xmlns="http://www.w3.org/2000/svg" width="760" height="206" viewBox="0 0 760 206" role="img" aria-labelledby="title description">
  <title id="title">Save a note, ask later, get an answer</title>
  <desc id="description">Save a note that Kit Copper will test the blue lantern. Later, ask who is testing the lantern. Your assistant answers Kit Copper and points to the meeting note.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .step { fill: #f3f5f7; font-size: 25px; font-weight: 650; letter-spacing: -.35px; }
    .prompt { fill: #d0d7e1; font-size: 20px; }
    .answer { fill: #f3f5f7; font-weight: 650; }
  </style>

  <rect width="760" height="206" fill="#121418"/>
  <path d="M139 55H621" stroke="#5c626e" stroke-width="2"/>
  <g fill="#9dd1ff" stroke-linecap="round">
    <path id="trail" d="M139 55H621" fill="none" stroke="#9dd1ff" stroke-width="2.5"/>
    <circle cx="139" cy="55" r="5.5"/>
    <circle id="ask" cx="380" cy="55" r="5.5"/>
    <circle id="answer" cx="621" cy="55" r="5.5"/>
  </g>

  <g text-anchor="middle">
    <text class="step" x="139" y="103">Save a note</text>
    <text class="step" x="380" y="103">Ask later</text>
    <text class="step" x="621" y="103">Get an answer</text>

    <text class="prompt" x="139" y="143">“Kit Copper will test<tspan x="139" y="169">the blue lantern.”</tspan></text>
    <text class="prompt" x="380" y="143">“Who’s testing<tspan x="380" y="169">the lantern?”</tspan></text>
    <text class="prompt" x="621" y="143"><tspan class="answer">Kit Copper.</tspan><tspan x="621" y="169">From the meeting note.</tspan></text>
  </g>
</svg>
