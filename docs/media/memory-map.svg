    <path d="M486 140Q502 107 503 64 M486 140Q519 108 557 97 M486 140Q539 132 585 139"/>
    <path d="M222 236Q190 226 164 196 M222 236H133 M222 236Q198 265 165 281"/>
    <path d="M538 236Q570 226 596 196 M538 236H608 M538 236Q562 265 595 281"/>
    <path d="M274 344Q222 336 174 345 M274 344Q251 382 221 399 M274 344Q266 387 273 434"/>
    <path d="M486 344Q538 336 586 345 M486 344Q509 382 539 399 M486 344Q494 387 487 434"/>
    <path class="related" d="M257 64C320 25 440 25 503 64 M165 281C190 296 190 327 174 345 M595 281C570 296 570 327 586 345 M273 434Q380 469 487 434"/>
  </g>

  <g class="branches">
