<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title description">
  <title id="title">Rainy Robot Club memory map</title>
  <desc id="description">A fictional topic with six branches. Notes, sources, people, decisions, projects, and to-dos each have three entries. Dashed lines connect Club meeting to Meeting text, Kit Copper to Test the lantern, Use blue lantern to Welcome table, and Put up signs to Club signs.</desc>
  <style>
    .topic, .branches { fill: #27231f; font-family: Georgia, 'Times New Roman', serif; }
    .topic { font-size: 23px; }
    .branches { font-size: 20px; }
    .branches circle { fill: #76614f; }
    .links { fill: none; stroke: #948170; stroke-width: 1.3; stroke-linecap: round; }
    .related { stroke: #a65038; stroke-dasharray: 2 5; }
    .entries { fill: #302922; font: 16px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .entries circle { fill: #f8f4ec; stroke: #796a5a; stroke-width: 1.4; }
    .entries .linked { fill: #a65038; stroke: #a65038; }
  </style>

  <rect x=".5" y=".5" width="759" height="469" rx="14" fill="#f8f4ec" stroke="#ded3c5"/>

