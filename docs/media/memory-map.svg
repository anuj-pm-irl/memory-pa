    <path d="M486 140 503 64 M486 140 557 97 M486 140 585 139"/>
    <path d="M222 236 164 196 M222 236H133 M222 236 165 281"/>
    <path d="M538 236 596 196 M538 236H608 M538 236 595 281"/>
    <path d="M274 344 174 345 M274 344 221 399 M274 344 273 434"/>
    <path d="M486 344 586 345 M486 344 539 399 M486 344 487 434"/>
    <path class="related" d="M257 64C320 25 440 25 503 64 M165 281C190 296 190 327 174 345 M595 281C570 296 570 327 586 345 M273 434Q380 469 487 434"/>
  </g>

