    <circle cx="203" cy="97" r="3.3"/><text x="192" y="102">Lantern checklist</text>
    <circle cx="175" cy="139" r="3.3"/><text x="164" y="144">Setup notes</text>
    <circle cx="164" cy="196" r="3.3"/><text x="153" y="201">Fern Bolt</text>
