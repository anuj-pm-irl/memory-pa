    <text x="286" y="131">Notes</text>
    <circle cx="486" cy="140" r="4"/>
    <text x="474" y="131" text-anchor="end">Sources</text>
    <circle cx="222" cy="236" r="4"/>
    <text x="210" y="215">People</text>
    <circle cx="538" cy="236" r="4"/>
    <text x="550" y="215" text-anchor="end">Decisions</text>
    <circle cx="274" cy="344" r="4"/>
    <text x="286" y="360">To-dos</text>
