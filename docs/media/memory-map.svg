    <circle cx="222" cy="236" r="4"/>
    <text x="234" y="205">People</text>
    <circle cx="538" cy="236" r="4"/>
    <text x="526" y="205" text-anchor="end">Decisions</text>
    <circle cx="274" cy="344" r="4"/>
    <text x="286" y="360">To-dos</text>
    <circle cx="486" cy="344" r="4"/>
    <text x="474" y="360" text-anchor="end">Projects</text>
  </g>

  <g class="entries" text-anchor="end">
    <circle cx="257" cy="64" r="3.3"/><text x="246" y="69">Club meeting</text>
    <circle cx="203" cy="97" r="3.3"/><text x="192" y="102">Lantern checklist</text>
    <circle cx="175" cy="139" r="3.3"/><text x="164" y="144">Setup notes</text>
    <circle cx="164" cy="196" r="3.3"/><text x="153" y="201">Fern Bolt</text>
    <circle cx="133" cy="236" r="3.3"/><text x="122" y="241">Tess Relay</text>
    <circle cx="165" cy="281" r="3.3"/><text x="154" y="286">Kit Copper</text>
    <circle cx="174" cy="345" r="3.3"/><text x="163" y="350">Test the lantern</text>
    <circle cx="221" cy="399" r="3.3"/><text x="210" y="404">Bring batteries</text>
    <circle cx="273" cy="434" r="3.3"/><text x="262" y="439">Put up signs</text>
  </g>

