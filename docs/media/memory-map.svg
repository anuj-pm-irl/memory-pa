<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title description">
  <title id="title">Rainy Robot Club memory map</title>
  <desc id="description">A fictional topic with six branches. Notes, sources, people, decisions, projects, and to-dos each have three entries. Dashed lines connect Club meeting to Meeting text, Kit Copper to Test the lantern, Use blue lantern to Welcome table, and Put up signs to Club signs.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .links { fill: none; stroke: #8490a4; stroke-width: 1.4; stroke-linecap: round; }
    .related { stroke: #5a61b4; stroke-dasharray: 3 5; }
    .branches { fill: #47566d; font-size: 17px; font-weight: 650; }
    .entries { fill: #2b3547; font-size: 16px; }
    .entries circle { fill: #fcfcfe; stroke: #6b7890; stroke-width: 1.45; }
  </style>

  <rect x=".5" y=".5" width="759" height="469" rx="16" fill="#fcfcfe" stroke="#dde1ea"/>

  <g class="links">
    <path d="M274 140 335 212 M486 140 425 212 M222 236H300 M538 236H460 M274 344 335 260 M486 344 425 260"/>
